[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-opencor"
version = "0.1.0"
description = "process-bigraph-compatible OpenCOR / CellML Steps and Processes (UTC + SteadyState) via libOpenCOR"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vivarium Collective"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "process-bigraph>=0.0.10",
    "bigraph-schema",
    "libopencor",
    "viva-superpowers",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "bigraph-viz", "matplotlib", "plotly"]

[tool.uv.sources]
# viva-superpowers (renamed from pbg-superpowers) is git-only, not on PyPI.
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["viva_opencor*"]

[tool.setuptools.package-data]
"viva_opencor.composites" = ["*.cellml", "*.yaml"]
